# Serves the built SPA and reverse-proxies the API on the same origin, so the
# browser makes no cross-origin request.
#
# Two server blocks, one per audience:
#   - container port 80   -- the application. Published on host 5173.
#                            The Django admin and the RQ dashboard return 404 here.
#   - container port 8081 -- the Django admin and the RQ dashboard, nothing else.
#                            Published on host 5174, which PACE's firewall opens
#                            only to the admin group.
#
# Every proxy block forwards Host as $http_host rather than $host. $host drops
# the port, so Django would see "gt-dare.pace.gatech.edu" while the browser's
# Origin says "http://gt-dare.pace.gatech.edu:5174", and the CSRF origin check
# would reject every admin login and save. Keeping the port also keeps it in any
# absolute URL Django builds (media links, admin redirects).
#
# "web" is the DARE backend's network alias on the dare Podman network.

upstream dare_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;   # file uploads go through this proxy

    # Vite fingerprints these, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy ships stale asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Django's collected static files, read straight from the dare-static volume
    # that dare-web runs collectstatic into. DRF's browsable API and the Swagger
    # page use them too, so they stay on this server as well as the admin one.
    # ^~ stops nginx from also trying the regex locations below.
    location ^~ /static/ {
        alias /srv/django-static/;
        expires 7d;
        access_log off;
    }

    # The admin and the RQ dashboard live on the admin server only. A plain 404
    # rather than a redirect to 5174: users outside the admin group cannot reach
    # that port anyway, and a redirect would advertise it.
    location ~ ^/(admin|django-rq)(/|$) {
        return 404;
    }

    # Every top-level prefix Django serves, minus the two above. The list is not
    # just /api/ -- several apps mount at the root, and authentication in
    # particular lives under /users/. Anything missing here falls through to the
    # SPA fallback below and returns index.html with a 200, which surfaces as a
    # confusing "unexpected token <" JSON parse error in the browser rather than
    # a 404.
    #
    # Regenerate after a backend URL change:
    #   podman exec dare-web python manage.py shell -c "..."   (see gt-dare-deploy/README.md)
    location ~ ^/(api|users|account|dare|mcp|syftbox|password-reset|media)/ {
        proxy_pass http://dare_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # LLM responses stream well past the default 60s
    }

    # Socket.IO needs the HTTP/1.1 upgrade dance; without these three headers the
    # handshake falls back to polling and token streaming stops working.
    location /socket.io/ {
        proxy_pass http://dare_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router owns every remaining path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;

    client_max_body_size 100M;   # admin file fields upload through here

    # The admin's own CSS and JavaScript.
    location ^~ /static/ {
        alias /srv/django-static/;
        expires 7d;
        access_log off;
    }

    # absolute_redirect off keeps the Location relative: nginx listens on 8081
    # inside the container and would otherwise build a URL with that port
    # instead of the published 5174.
    location = / {
        absolute_redirect off;
        return 302 /admin/;
    }

    location ~ ^/(admin|django-rq)$ {
        absolute_redirect off;
        return 301 $uri/;
    }

    # /media/ so file fields shown in the admin link to something that loads.
    location ~ ^/(admin|django-rq|media)/ {
        proxy_pass http://dare_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Nothing else -- not the SPA, not the API -- is served on the admin port.
    location / {
        return 404;
    }
}
